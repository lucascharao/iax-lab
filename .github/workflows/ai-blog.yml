# DESATIVADO: GitHub schedule NÃO é pontual o bastante.
# A automação do Blog IA roda no VPS via cron (e opcionalmente n8n).
# Ver: scripts/blog-cron.sh e docs/blog-ia-automacao.md
#
# Para teste manual no GitHub (não publica no ar sozinho):
# use workflow_dispatch e depois faça deploy no servidor.

name: Blog IA (manual only — prefer VPS cron)

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'morning | evening | manual'
        required: false
        default: 'manual'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish AI news (repo only)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SLOT: ${{ github.event.inputs.slot || 'manual' }}
          XAI_MODEL: grok-4.3
          XAI_IMAGE_MODEL: grok-imagine-image
        run: node scripts/publish-ai-news.mjs
      - name: Commit if changed
        run: |
          git config user.name "iax-blog-bot"
          git config user.email "blog-bot@iaxlab.top"
          git add public/blog
          if git diff --staged --quiet; then
            echo "Nenhuma mudança"
            exit 0
          fi
          git commit -m "blog(ia): notícia manual $(date -u +%Y-%m-%d)"
          git push
